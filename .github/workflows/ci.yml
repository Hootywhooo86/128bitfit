name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # verify-import needs node:sqlite (Node 22+); pinned here too so both
          # jobs type-check and run against the same runtime.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  verify-import:
    name: verify:import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite does not exist before Node 22, so this job cannot run on
          # the >=18 that package.json engines allows.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Imports the bundled JSON into SQLite and fails on a count mismatch.
      - run: npm run verify:import
