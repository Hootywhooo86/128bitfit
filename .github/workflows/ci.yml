name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # verify-import needs node:sqlite (Node 22+); pinned here too so both
          # jobs type-check and run against the same runtime.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Warnings fail the run too: an unused import or a missed hook
      # dependency is cheapest to fix in the PR that adds it.
      - run: npm run lint -- --max-warnings 0

  test:
    name: test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      # The date helpers exist to avoid UTC day-boundary bugs, so running only
      # in UTC would miss exactly what they guard against. Kiritimati is UTC+14
      # and Kathmandu is a +05:45 half-hour offset.
      fail-fast: false
      matrix:
        tz: [UTC, America/Los_Angeles, Pacific/Kiritimati, Asia/Kathmandu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  verify-import:
    name: verify:import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # node:sqlite does not exist before Node 22, so this job cannot run on
          # the >=18 that package.json engines allows.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Imports the bundled JSON into SQLite and fails on a count mismatch.
      - run: npm run verify:import
